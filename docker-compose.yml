services:
  redis:
    image: redis:7-alpine
    container_name: secnet-toolkit-redis
    restart: unless-stopped
    networks:
      - secnet-toolkit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    image: ghcr.io/karlocizma/secnet-toolkit-backend:${SECNET_TOOLKIT_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secnet-toolkit-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-development-secret-key}
      - FLASK_ENV=${FLASK_ENV:-production}
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-redis://redis:6379}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ALLOW_PRIVATE_TARGETS=${ALLOW_PRIVATE_TARGETS:-false}
      - MONITOR_PUBLIC=${MONITOR_PUBLIC:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Expiry alerts (all optional; see backend/app/services/alerts.py)
      - CT_API_URL=${CT_API_URL:-https://crt.sh/}
      - CT_CACHE_SECONDS=${CT_CACHE_SECONDS:-900}
      - RDAP_CACHE_SECONDS=${RDAP_CACHE_SECONDS:-21600}
      - STATUS_PAGE_ENABLED=${STATUS_PAGE_ENABLED:-true}
      - STATUS_PAGE_TITLE=${STATUS_PAGE_TITLE:-Certificate status}
      - AUDIT_LOG_MAX_BYTES=${AUDIT_LOG_MAX_BYTES:-5242880}
      - AUDIT_LOG_KEEP=${AUDIT_LOG_KEEP:-5}
      - RBL_RESOLVERS=${RBL_RESOLVERS:-}
      - RBL_LISTS=${RBL_LISTS:-}
      - ACME_DNS_RESOLVERS=${ACME_DNS_RESOLVERS:-1.1.1.1,8.8.8.8}
      - ENABLE_ACME=${ENABLE_ACME:-false}
      - ALERT_THRESHOLDS=${ALERT_THRESHOLDS:-30,14,7,1}
      - ALERT_CHECK_INTERVAL_HOURS=${ALERT_CHECK_INTERVAL_HOURS:-12}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_TEAMS_WEBHOOK_URL=${ALERT_TEAMS_WEBHOOK_URL:-}
      - APP_URL=${APP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
    volumes:
      - secnet-toolkit-data:/app/data
    networks:
      - secnet-toolkit-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/karlocizma/secnet-toolkit-frontend:${SECNET_TOOLKIT_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secnet-toolkit-frontend
    restart: unless-stopped
    networks:
      - secnet-toolkit-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: secnet-toolkit-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/ssl
    networks:
      - secnet-toolkit-network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  secnet-toolkit-network:
    driver: bridge

volumes:
  secnet-toolkit-data:
    driver: local

