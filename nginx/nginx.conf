upstream backend {
    server backend:5000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # Written by scripts/trust-proxy.sh (client address from a trusted reverse proxy); matches nothing otherwise
    include /etc/nginx/ssl/realip*.conf;

    # Written by scripts/enable-https.sh when HTTP should redirect to HTTPS; matches nothing otherwise
    include /etc/nginx/ssl/http-redirect*.conf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API routes
    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeout for SSL operations
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Frontend routes
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS is opt-in. `scripts/enable-https.sh` writes ./certs/cert.pem, ./certs/key.pem and ./certs/https.conf
# (from nginx/https.conf.example); with none of them present this include matches nothing and only HTTP is served.
# To use your own certificate instead, put cert.pem and key.pem in ./certs/ and copy nginx/https.conf.example
# to ./certs/https.conf. Then restart nginx.
include /etc/nginx/ssl/https*.conf;
